name: Test du parcours principal
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: npm i --no-save three@0.160.0
      - run: python3 tools/build.py
      - run: python3 tools/test/make_fixture.py /tmp/fixture.json
      - run: python3 tools/test/smoke.py node_modules/three /tmp/fixture.json /tmp/out
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: captures, path: /tmp/out}
